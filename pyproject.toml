[project]
name = "manga-drama-agent"
version = "0.1.0"
description = "多 Agent 协作的 AI 漫剧全流程制作系统（LangGraph）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-sqlite>=2,<3",
    "langchain-openai>=0.2,<2",
    "langchain-core>=0.3,<2",
    "langchain-community>=0.3,<2",
    "tavily-python>=0.3,<1",
    "dashscope>=1.20,<2",
    "openai>=1.0,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=8.0,<10.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26",
    "gradio>=4.40,<5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
# 可选视觉依赖：跨分镜角色一致性校验（face embedding）。未装时 consistency 模块自动降级。
vision = [
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 过渡期双包共存；Task 11 清扫后仅保留 src/codeguard
packages = ["src/manga_drama", "src/codeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
