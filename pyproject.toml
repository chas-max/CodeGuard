[project]
name = "codeguard-agent"
version = "0.2.0"
description = "基于 LangGraph 与沙箱自愈的企业级 Repo 自动化 Bug 修复与单测生成 Multi-Agent 系统（CodeGuard-Agent）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0.12,<4",
    "langchain-openai>=0.2,<3",
    "langchain-core>=0.3,<2",
    "openai>=1.0,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=8.0,<10.0",
    "httpx>=0.27,<2.0",
    "gradio>=4.40",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
# 可选静态分析增强（未装时静态门控自动降级为纯 AST 检查）
lint = [
    "ruff>=0.5",
]
dev = [
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
