[project]
name = "codeguard-agent"
version = "0.3.0"
description = "GitHub PR 问题判定、混合检测、修复与合并的 LangGraph 多 Agent 系统"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0.12,<4",
    "langchain-openai>=0.2,<3",
    "langchain-core>=0.3,<2",
    "openai>=1.0,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=8.0,<10.0",
    "httpx>=0.27,<2.0",
    "PyYAML>=6.0,<7.0",
    "PyJWT[crypto]>=2.8,<3",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mcp>=1.0,<2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "docker>=7.0,<8.0",
]

[project.optional-dependencies]
ui = ["gradio>=4.40"]
lint = ["ruff>=0.5"]
dev = ["ruff>=0.5", "pytest-asyncio>=0.23"]

[project.scripts]
codeguard = "codeguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "docker: 需要真实 Docker daemon 与 codeguard-sandbox-python 镜像",
    "github: 需要真实 GitHub token（默认跳过）",
]
